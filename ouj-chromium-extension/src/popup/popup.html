<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放送大学拡張機能</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="popup-container">
        <h1>放送大学拡張機能</h1>
        
        <!-- 大きな放送大学ページボタン -->
        <div id="ouj-home-section">
            <button id="open-ouj-home" class="ouj-home-button">
                <span class="button-icon">🏫</span>
                <span class="button-text">放送大学ホームページを開く</span>
            </button>
        </div>
        
        <!-- 自動ログイン設定 -->
        <div id="auto-login-section">
            <label for="auto-login-checkbox" class="auto-login-label">
                <input type="checkbox" id="auto-login-checkbox" name="auto-login">
                <span class="checkbox-text">未ログインの場合に自動でログイン画面を表示</span>
            </label>
        </div>
        
        <!-- TODO: ポップアップやメニューのデザイン統一感を向上させる。UI/UXの一貫性や見た目の調整を検討すること。 -->

    </div>
    <script src="popup.js"></script>
</body>
</html>
