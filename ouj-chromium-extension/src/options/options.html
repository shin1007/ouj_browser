<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放送大学拡張機能 - オプション設定</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <h1>放送大学拡張機能 - オプション設定</h1>
    <form id="options-form">
        <label for="auto-login">自動ログイン:</label>
        <input type="checkbox" id="auto-login" name="auto-login"><br>

        <label for="audio-only">音声のみ:</label>
        <input type="checkbox" id="audio-only" name="audio-only"><br>

        <label for="remove-intro-outro">オープニングとエンディングの削除:</label>
        <input type="checkbox" id="remove-intro-outro" name="remove-intro-outro"><br>

        <label for="playback-speed">再生速度:</label>
        <select id="playback-speed" name="playback-speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
        </select><br>

        <label for="favorites">お気に入り:</label>
        <input type="text" id="favorites" name="favorites" placeholder="お気に入りの動画IDをカンマ区切りで"><br>

        <button type="submit">設定を保存</button>
    </form>
    <script src="options.js"></script>
</body>
</html>
